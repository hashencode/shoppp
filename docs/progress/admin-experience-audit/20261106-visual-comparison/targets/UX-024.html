<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-024 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-024</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel">
        <h2>联系信息</h2>
        <div class="field">
          <label>公开电话</label>
          <div class="input">+12025550199</div>
        </div>
        <span class="tag amber">有未保存修改</span>
      </section>
      <section class="panel">
        <h2>有未保存的联系信息</h2>
        <div class="changed">
          <span class="number">1</span>
          <p>离开后，这些修改将丢失。你可以继续编辑，或放弃修改后离开。</p>
        </div>
        <div class="changed">
          <span class="number">2</span>
          <div class="footer">
            <span class="btn">放弃修改并离开</span><span class="btn primary">继续编辑</span>
          </div>
        </div>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
