<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-007 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-007</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel changed">
        <span class="number">2</span>
        <h2>品牌素材</h2>
        <div class="field">
          <label>主标志</label>
          <div class="input">&nbsp;</div>
          <small class="help">从已批准的品牌素材中选择。</small>
        </div>
        <div class="changed">
          <span class="number">1</span>
          <div class="empty-icon">▧</div>
          <h2>还没有可用的标志素材</h2>
          <p>先准备并完成素材审批，再回到这里选择。已填店铺资料会保留。</p>
        </div>
        <div class="footer">
          <span class="btn primary">准备品牌素材</span><span class="btn">刷新素材列表</span>
        </div>
      </section>
      <div class="notice info">素材仍需满足现有审批与引用规则。</div>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
