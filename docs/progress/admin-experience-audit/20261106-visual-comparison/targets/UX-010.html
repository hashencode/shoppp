<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-010 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-010</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel changed">
        <span class="number">1</span>
        <h2>商品图片</h2>
        <div class="media">
          <img src="../assets/product-reference.jpg" alt="用于示意的测试商品图" />
          <div>
            <b>relaxed-corduroy-shirt.jpg</b>
            <p><span class="tag green">600 × 765 px · 图片示例</span></p>
            <p class="help">由图片识别固有尺寸</p>
            <span class="btn">替换图片</span>
          </div>
        </div>
      </section>
      <section class="panel changed">
        <span class="number">2</span>
        <h2>图片描述</h2>
        <div class="field">
          <label>替代文本</label>
          <div class="input">灯芯绒衬衫商品图</div>
        </div>
        <details>
          <summary>查看媒体详情</summary>
          <p>媒体Key与固有尺寸保留在这里；替换图片后同步更新。</p>
        </details>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
