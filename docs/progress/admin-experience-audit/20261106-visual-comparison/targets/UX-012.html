<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-012 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-012</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel">
        <h2>发布测试商品</h2>
        <div class="field">
          <label>发布原因</label>
          <div class="input">UX visual comparison recheck 20261106</div>
        </div>
        <div class="changed">
          <span class="number">1</span>
          <div class="notice error">发布未完成，当前草稿与输入已保留。</div>
        </div>
        <div class="changed">
          <span class="number">2</span>
          <p>当前未返回明确失败原因。请保留诊断信息，核对发布条件后继续。</p>
          <div class="diagnostic">请求编号：示意编号<br />具体原因：以服务实际返回为准</div>
          <div class="footer">
            <span class="btn">复制诊断信息</span><span class="btn primary">查看发布条件</span>
          </div>
        </div>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
