<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-021 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-021</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel">
        <h2>角色权限 · Analyst</h2>
        <div class="changed">
          <span class="number">1</span>
          <div class="field">
            <label>搜索权限</label>
            <div class="input">报表</div>
          </div>
          <div class="row">
            <span><span class="tag neutral">2项匹配 · 当前1/2</span></span
            ><span><span class="btn">上一项</span><span class="btn">下一项</span></span>
          </div>
        </div>
        <div class="changed">
          <span class="number">2</span>
          <div class="tree">
            <p class="help">商品目录　1/4</p>
            <p class="help">库存　1/2</p>
            <p class="tree-match">▾ 报表　2/2</p>
            <p class="tree-child tree-match">☑ 查看报表</p>
            <p class="tree-child tree-match">☑ 导出报表</p>
          </div>
        </div>
      </section>
      <div class="notice info">搜索与定位不改变现有权限勾选。</div>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
