<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-003 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-003</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel changed">
        <span class="number">2</span>
        <h2>联系信息</h2>
        <span class="tag amber">有未保存修改</span>
        <p>新地点已加入页面草稿，保存联系信息后才生效。</p>
        <div class="footer"><span class="btn primary">保存联系方式</span></div>
      </section>
      <section class="panel changed">
        <span class="number">1</span>
        <h2>新增地点</h2>
        <div class="field">
          <label>地点名称</label>
          <div class="input">测试展示地点</div>
        </div>
        <div class="field">
          <label>邮寄地址</label>
          <div class="input">地址示意</div>
        </div>
        <div class="footer">
          <span class="btn">取消</span><span class="btn primary">添加到联系信息</span>
        </div>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
