<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-009 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-009</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel changed">
        <span class="number">1</span>
        <h2>新建商品</h2>
        <span class="tag neutral">草稿</span>
        <div class="tabs"><b>基本信息</b><span>变体与定价</span><span>媒体与SEO</span></div>
        <div class="field">
          <label>名称</label>
          <div class="input">Audit visual product</div>
        </div>
        <div class="field">
          <label>标识</label>
          <div class="input">audit-visual-product</div>
        </div>
        <div class="field">
          <label>描述</label>
          <div class="input">商品描述示意</div>
        </div>
      </section>
      <section class="panel changed">
        <span class="number">2</span>
        <h2>准备情况</h2>
        <div class="checklist">
          <p>✓ 基本信息</p>
          <p>○ 变体与物流　<span class="link">继续填写 →</span></p>
          <p>○ 图片与搜索展示　<span class="link">继续填写 →</span></p>
        </div>
        <p class="help">保存与发布的必备条件分别说明；现有必填规则需先核对。</p>
      </section>
      <div class="footer">
        <span class="btn primary">保存草稿</span><span class="btn">检查发布条件</span>
      </div>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
