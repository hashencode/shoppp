<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-025 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-025</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel">
        <h2>重置链接无效</h2>
        <div class="changed">
          <span class="number">1</span>
          <div class="notice error">此重置链接无效或已过期。</div>
          <p>重新申请一次性重置链接，或返回登录。</p>
          <div class="footer">
            <span class="btn">返回登录</span><span class="btn primary">重新申请重置链接</span>
          </div>
        </div>
      </section>
      <section class="panel">
        <h2>激活链接无效</h2>
        <div class="changed">
          <span class="number">2</span>
          <p>请联系邀请你的管理员，重新发送有效邀请。</p>
          <span class="btn">返回登录</span>
        </div>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
