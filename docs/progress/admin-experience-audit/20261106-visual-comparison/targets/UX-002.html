<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-002 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-002</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel changed">
        <span class="number">1</span>
        <h2>配送与资源选择</h2>
        <div class="field">
          <label>店铺启用的配送方式</label>
          <div class="input">尚未选到可用配送方式</div>
          <small class="help">请选择名称清楚、适用地区正确的方式。</small>
        </div>
        <div class="notice info">当前引用的方式不可用，请先核对配送配置。</div>
        <div class="footer"><span class="btn primary">前往配送设置</span></div>
      </section>
      <section class="panel changed">
        <span class="number">2</span>
        <h2>资源详情</h2>
        <details>
          <summary>查看原始资源标识</summary>
          <code>ship_01J00000000000000000000000</code>
        </details>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
