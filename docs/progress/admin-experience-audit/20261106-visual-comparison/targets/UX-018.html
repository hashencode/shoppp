<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-018 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-018</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel changed">
        <span class="number">1</span>
        <h2>经营仪表盘</h2>
        <div class="row">
          <div>
            <div class="field">
              <label>统计范围</label>
              <div class="input">最近30天</div>
            </div>
          </div>
          <div>
            <div class="field">
              <label>时区</label>
              <div class="input">Asia/Shanghai</div>
            </div>
          </div>
        </div>
      </section>
      <div class="metrics">
        <section class="panel">
          <h2>订单收入</h2>
          <strong class="metric">—</strong>
          <p class="help">暂无可统计数据</p>
        </section>
        <section class="panel">
          <h2>订单数</h2>
          <strong class="metric">—</strong>
          <p class="help">暂无可统计数据</p>
        </section>
        <section class="panel">
          <h2>客单价</h2>
          <strong class="metric">—</strong>
          <p class="help">暂无可统计数据</p>
        </section>
      </div>
      <section class="panel changed">
        <span class="number">2</span>
        <h2>开始积累经营数据</h2>
        <p>当前没有可展示的经营统计。准备商品与店铺后，可通过测试订单核对数据链路。</p>
        <div class="footer">
          <span class="btn primary">查看开店进度</span><span class="btn">查看收入报表</span>
        </div>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
