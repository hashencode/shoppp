<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-017 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-017</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel">
        <h2>审核与发布</h2>
        <div class="changed">
          <span class="number">1</span><span class="tag green">✓ 装修已保存</span>
          <p>当前没有待保存的修改。</p>
        </div>
        <div class="changed">
          <span class="number">2</span>
          <div class="notice info">尚未关联可用的已发布资源。</div>
          <p>完成关联后，才能构建正式预览并继续审核。</p>
          <span class="btn primary">准备并关联资源</span>
        </div>
      </section>
      <section class="panel">
        <h2>发布条件</h2>
        <ol class="steps">
          <li>关联已发布资源 · 待完成</li>
          <li>构建正式预览与批准 · 待完成</li>
          <li>正式发布 · 前置条件满足后可用</li>
        </ol>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
