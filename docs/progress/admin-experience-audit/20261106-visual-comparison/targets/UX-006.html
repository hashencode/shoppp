<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-006 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-006</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel changed">
        <span class="number">1</span>
        <h2>设置配送</h2>
        <ol class="steps">
          <li>创建区域与配送方式</li>
          <li>选择店铺启用方式</li>
          <li>核对国家与配送方式关联</li>
        </ol>
      </section>
      <section class="panel">
        <h2>1. 配送方式</h2>
        <p>已有配送区域可继续维护；区域与方式需处于可用状态。</p>
        <span class="btn">前往配送设置</span>
      </section>
      <section class="panel changed">
        <span class="number">2</span>
        <h2>2. 店铺启用方式</h2>
        <p>在商业设置中选择本店启用的配送方式。</p>
        <span class="btn primary">前往商业设置 · 配送方式</span>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
