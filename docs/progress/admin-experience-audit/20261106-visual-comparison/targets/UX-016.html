<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UX-016 目标示意</title>
    <link rel="stylesheet" href="target.css" />
  </head>
  <body>
    <header class="top">
      <strong>Shoppp 后台</strong><span>UX-016</span
      ><span class="watermark">目标设计示意 · 未实现</span>
    </header>
    <main class="canvas">
      <section class="panel changed">
        <span class="number">2</span>
        <h2>装修预览</h2>
        <div class="changed">
          <span class="number">1</span>
          <div class="empty-icon">▧</div>
          <h2>预览需要可用的已发布资源</h2>
          <p>装修草稿已经保留。先准备资源，再回到这里关联，才能看到真实店铺预览。</p>
        </div>
        <ol class="steps">
          <li>查看并完成资源的发布前提</li>
          <li>选择一份可用的已发布资源</li>
          <li>刷新真实预览</li>
        </ol>
        <div class="footer">
          <span class="btn primary">查看资源准备入口</span
          ><span class="btn">重新选择已发布数据</span>
        </div>
      </section>
    </main>
    <p class="footnote">静态示意：用于比较布局与状态，控件不会操作后台。</p>
  </body>
</html>
