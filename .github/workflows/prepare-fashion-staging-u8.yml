name: Prepare governed Fashion staging U8 operator run

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Register an operator run or refresh after server-side approval
        required: true
        type: choice
        options:
          - prepare
          - refresh
      candidate_sha:
        description: Frozen U12 candidate commit
        required: true
      harness_sha:
        description: Reviewed U8 harness commit; must be the current main workflow SHA
        required: true
      harness_manifest_digest:
        description: SHA-256 of the reviewed canonical U8 harness manifest
        required: true
      source_draft_id:
        description: Existing Fashion staging draft assigned to the named operator
        required: false
      catalog_release_id:
        description: Frozen U12 catalog release
        required: false
      u12_readiness_commit_sha:
        description: Fresh U12 readiness commit
        required: true
      u12_readiness_run_id:
        description: Successful U12 readiness workflow run
        required: true
      u12_readiness_digest:
        description: SHA-256 of the fresh U12 readiness snapshot
        required: true
      operator_run_id:
        description: Existing awaiting_operator run id; required for refresh
        required: false
      preparation_run_id:
        description: Successful prepare run containing the exact operator manifest
        required: false
      preparation_artifact_name:
        description: Exact preparation artifact; required for refresh
        required: false
      superseded_operator_run_id:
        description: Failed awaiting-operator run to reject before a fresh preparation
        required: false

concurrency:
  group: fashion-staging-u8-${{ inputs.operation }}
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  verify-authority:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'hashencode/shoppp' &&
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECTED_REPOSITORY: hashencode/shoppp
      FASHION_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      FASHION_HARNESS_SHA: ${{ inputs.harness_sha }}
      FASHION_STAGING_OPERATORS: ${{ vars.FASHION_STAGING_OPERATORS }}
      GITHUB_REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - name: Verify credential-free workflow authority and standard runner capability
        run: |
          bun tools/verify-fashion-cloud-authority.ts
          test "$(git rev-parse HEAD)" = "$FASHION_HARNESS_SHA"
          git merge-base --is-ancestor "$FASHION_CANDIDATE_SHA" "$FASHION_HARNESS_SHA"
          test "${{ inputs.harness_manifest_digest }}" = "${{ vars.FASHION_U8_HARNESS_MANIFEST_DIGEST }}"
          mkdir -p artifacts/fashion-u8
          FASHION_U8_CANDIDATE_SHA="$FASHION_CANDIDATE_SHA" FASHION_U8_HARNESS_SHA="$FASHION_HARNESS_SHA" \
            bun tools/create-fashion-u8-harness-manifest.ts > artifacts/fashion-u8/harness-manifest.json
          test "$(sha256sum artifacts/fashion-u8/harness-manifest.json | cut -d ' ' -f 1)" = \
            "${{ inputs.harness_manifest_digest }}"
          bun tools/verify-fashion-u8-standing-authority.ts artifacts/fashion-u8/harness-manifest.json >/dev/null

  protected-prepare:
    if: ${{ inputs.operation == 'prepare' }}
    needs: verify-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: fashion-staging
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      API_ORIGIN: ${{ vars.PREVIEW_API_URL }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      HARNESS_SHA: ${{ inputs.harness_sha }}
      HARNESS_MANIFEST_DIGEST: ${{ inputs.harness_manifest_digest }}
      SOURCE_DRAFT_ID: ${{ inputs.source_draft_id }}
      CATALOG_RELEASE_ID: ${{ inputs.catalog_release_id }}
      U12_READINESS_COMMIT_SHA: ${{ inputs.u12_readiness_commit_sha }}
      U12_READINESS_RUN_ID: ${{ inputs.u12_readiness_run_id }}
      U12_READINESS_DIGEST: ${{ inputs.u12_readiness_digest }}
      OPERATOR_RUN_ID: fashion-u8-${{ github.run_id }}
      PREPARATION_ARTIFACT_NAME: fashion-u8-awaiting-operator-${{ github.run_id }}-${{ github.run_attempt }}
      SUPERSEDED_OPERATOR_RUN_ID: ${{ inputs.superseded_operator_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - name: Bind the protected job to GitHub OIDC claims
        env:
          EXPECTED_REPOSITORY: hashencode/shoppp
          FASHION_STAGING_OPERATORS: ${{ vars.FASHION_STAGING_OPERATORS }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          RESPONSE="$(curl --fail --silent --show-error --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shoppp-fashion-staging")"
          TOKEN="$(jq -er '.value' <<<"$RESPONSE")"
          echo "::add-mask::$TOKEN"
          SHOPPP_GITHUB_OIDC_TOKEN="$TOKEN" bun tools/verify-github-oidc-claims.ts
      - name: Verify exact successful U12 readiness provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$SOURCE_DRAFT_ID"
          test -n "$CATALOG_RELEASE_ID"
          test -z "$SUPERSEDED_OPERATOR_RUN_ID" || \
            [[ "$SUPERSEDED_OPERATOR_RUN_ID" =~ ^fashion-u8-[A-Za-z0-9._:-]{1,180}$ ]]
          [[ "$U12_READINESS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p artifacts/fashion-u8/u12
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$U12_READINESS_RUN_ID" > artifacts/fashion-u8/u12-run.json
          jq --exit-status --arg commit "$U12_READINESS_COMMIT_SHA" \
            '.path == ".github/workflows/prepare-fashion-staging-u12.yml" and .event == "workflow_dispatch" and
             .head_sha == $commit and .status == "completed" and .conclusion == "success"' \
            artifacts/fashion-u8/u12-run.json >/dev/null
          git merge-base --is-ancestor "$U12_READINESS_COMMIT_SHA" "$CANDIDATE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          name: fashion-u12-readiness-${{ inputs.u12_readiness_commit_sha }}
          path: artifacts/fashion-u8/u12
          run-id: ${{ inputs.u12_readiness_run_id }}
      - name: Register the non-secret awaiting_operator boundary
        env:
          ADMIN_SERVICE_TOKEN: ${{ secrets.FASHION_U12_ADMIN_SERVICE_TOKEN }}
          FASHION_U12_ACCEPTANCE_TOKEN: ${{ secrets.FASHION_U12_ACCEPTANCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${#ADMIN_SERVICE_TOKEN}" -ge 32
          test "$(sha256sum artifacts/fashion-u8/u12/readiness.json | cut -d ' ' -f 1)" = "$U12_READINESS_DIGEST"
          jq --exit-status --arg commit "$U12_READINESS_COMMIT_SHA" --arg catalog "$CATALOG_RELEASE_ID" \
            '.commitSha == $commit and .seed.catalogReleaseId == $catalog and
             (.seed.experienceSnapshotId | type == "string") and (.seed.buildId | type == "string")' \
            artifacts/fashion-u8/u12/readiness.json >/dev/null
          FASHION_U8_CANDIDATE_SHA="$CANDIDATE_SHA" FASHION_U8_HARNESS_SHA="$HARNESS_SHA" \
            bun tools/create-fashion-u8-harness-manifest.ts > artifacts/fashion-u8/harness-manifest.json
          CONTRACT_TEST_DIGEST="$(jq -er '.contractTestDigest' artifacts/fashion-u8/harness-manifest.json)"
          U12_SNAPSHOT_ID="$(jq -er '.seed.experienceSnapshotId' artifacts/fashion-u8/u12/readiness.json)"
          U12_BUILD_ID="$(jq -er '.seed.buildId' artifacts/fashion-u8/u12/readiness.json)"
          curl --connect-timeout 10 --max-time 60 --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_SERVICE_TOKEN" \
            "$API_ORIGIN/admin/storefront-experiences/builds/$U12_BUILD_ID" \
            --output artifacts/fashion-u8/u12-deployed-build.json
          jq --exit-status --arg build "$U12_BUILD_ID" --arg snapshot "$U12_SNAPSHOT_ID" \
            --arg catalog "$CATALOG_RELEASE_ID" \
            '.data.id == $build and .data.snapshotId == $snapshot and
             .data.inputIdentity.experienceSnapshotId == $snapshot and
             .data.inputIdentity.catalogReleaseId == $catalog and .data.status == "deployed" and
             (.data.artifactDigest | test("^[a-f0-9]{64}$")) and
             .data.artifactPrefix ==
               ("snapshots/" + $snapshot + "/" + $catalog + "/" + .data.artifactDigest)' \
            artifacts/fashion-u8/u12-deployed-build.json >/dev/null
          U12_ARTIFACT_DIGEST="$(jq -er '.data.artifactDigest' artifacts/fashion-u8/u12-deployed-build.json)"
          RUN_CREATED_AT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')"
          EXPIRES_AT="$(node -e 'process.stdout.write(new Date(Date.parse(process.argv[1])+12*60*60*1000).toISOString())' "$RUN_CREATED_AT")"
          jq --null-input --sort-keys \
            --arg candidateSha "$CANDIDATE_SHA" --arg catalogReleaseId "$CATALOG_RELEASE_ID" \
            --arg contractTestDigest "$CONTRACT_TEST_DIGEST" --arg expiresAt "$EXPIRES_AT" \
            --arg harnessManifestDigest "$HARNESS_MANIFEST_DIGEST" --arg harnessSha "$HARNESS_SHA" \
            --arg repository "$GITHUB_REPOSITORY" --arg runId "$OPERATOR_RUN_ID" \
            --arg sourceDraftId "$SOURCE_DRAFT_ID" --arg u12ArtifactDigest "$U12_ARTIFACT_DIGEST" \
            --arg u12ReadinessCommitSha "$U12_READINESS_COMMIT_SHA" \
            --arg u12ReadinessDigest "$U12_READINESS_DIGEST" \
            --arg u12ReadinessRunId "$U12_READINESS_RUN_ID" --arg u12SnapshotId "$U12_SNAPSHOT_ID" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            '{schemaVersion:2,status:"awaiting_operator",environment:"fashion-staging",capabilityPreflight:"github-hosted-ubuntu-24.04",
              candidateSha:$candidateSha,catalogReleaseId:$catalogReleaseId,contractTestDigest:$contractTestDigest,
              expiresAt:$expiresAt,harnessManifestDigest:$harnessManifestDigest,harnessSha:$harnessSha,
              repository:$repository,runId:$runId,sourceDraftId:$sourceDraftId,u12ArtifactDigest:$u12ArtifactDigest,
              u12ReadinessCommitSha:$u12ReadinessCommitSha,u12ReadinessDigest:$u12ReadinessDigest,
              u12ReadinessRunId:$u12ReadinessRunId,u12SnapshotId:$u12SnapshotId,
              workflowRunId:$workflowRunId}' \
            > artifacts/fashion-u8/run-manifest.json
          RUN_MANIFEST_DIGEST="$(sha256sum artifacts/fashion-u8/run-manifest.json | cut -d ' ' -f 1)"
          jq --arg runManifestDigest "$RUN_MANIFEST_DIGEST" --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '{candidateSha,catalogReleaseId,contractTestDigest,expiresAt,harnessManifestDigest,harnessSha,
              repository,runId,sourceDraftId,u12ReadinessDigest,u12SnapshotId,workflowRunId,
              workflowRunAttempt:($workflowRunAttempt|tonumber),
              runManifestDigest:$runManifestDigest}' artifacts/fashion-u8/run-manifest.json \
            > artifacts/fashion-u8/operator-run-request.json
          if test -n "$SUPERSEDED_OPERATOR_RUN_ID"; then
            curl --connect-timeout 10 --max-time 60 --fail --silent --show-error \
              --request POST --header "Authorization: Bearer $FASHION_U12_ACCEPTANCE_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"reason":"Superseded after the legacy preview hook failed closed; use the reviewed GitHub-hosted successor."}' \
              "$API_ORIGIN/internal/testing/fashion-staging/operator-runs/$SUPERSEDED_OPERATOR_RUN_ID/reject" \
              > artifacts/fashion-u8/superseded-operator-run.json
            jq --exit-status --arg run "$SUPERSEDED_OPERATOR_RUN_ID" \
              '.data.runId == $run and .data.status == "rejected" and
               .data.successorSnapshotId == null and .data.approvalAuditId == null' \
              artifacts/fashion-u8/superseded-operator-run.json >/dev/null
          fi
          if ! curl --connect-timeout 10 --max-time 60 --fail --silent --show-error \
              --request POST --header "Authorization: Bearer $FASHION_U12_ACCEPTANCE_TOKEN" \
              --header "Content-Type: application/json" \
              --data @artifacts/fashion-u8/operator-run-request.json \
              "$API_ORIGIN/internal/testing/fashion-staging/operator-runs" \
              > artifacts/fashion-u8/operator-run-response.json; then
            curl --connect-timeout 10 --max-time 60 --fail --silent --show-error \
              --header "Authorization: Bearer $FASHION_U12_ACCEPTANCE_TOKEN" \
              "$API_ORIGIN/internal/testing/fashion-staging/operator-runs/$OPERATOR_RUN_ID" \
              > artifacts/fashion-u8/operator-run-response.json
          fi
          jq --exit-status --arg run "$OPERATOR_RUN_ID" \
            '.data.runId == $run and .data.status == "awaiting_operator" and
             .data.allowedAction == "complete_run_bound_editor_path" and
             .data.operatorIdentityId == null and .data.successorSnapshotId == null' \
            artifacts/fashion-u8/operator-run-response.json >/dev/null
          printf 'Fashion U8 run `%s` is awaiting the existing named operator. Open the existing source draft `%s`; this runner is exiting now.\n' \
            "$OPERATOR_RUN_ID" "$SOURCE_DRAFT_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: ${{ env.PREPARATION_ARTIFACT_NAME }}
          path: |
            artifacts/fashion-u8/run-manifest.json
            artifacts/fashion-u8/harness-manifest.json
            artifacts/fashion-u8/operator-run-request.json
            artifacts/fashion-u8/operator-run-response.json
            artifacts/fashion-u8/superseded-operator-run.json
            artifacts/fashion-u8/u12-deployed-build.json
          if-no-files-found: error
          retention-days: 30

  protected-refresh:
    if: ${{ inputs.operation == 'refresh' }}
    needs: verify-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: fashion-staging
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      API_ORIGIN: ${{ vars.PREVIEW_API_URL }}
      OPERATOR_RUN_ID: ${{ inputs.operator_run_id }}
      PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
      PREPARATION_ARTIFACT_NAME: ${{ inputs.preparation_artifact_name }}
      REFRESH_ARTIFACT_NAME: fashion-u8-refresh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - name: Bind the protected job to GitHub OIDC claims
        env:
          EXPECTED_REPOSITORY: hashencode/shoppp
          FASHION_STAGING_OPERATORS: ${{ vars.FASHION_STAGING_OPERATORS }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          RESPONSE="$(curl --fail --silent --show-error --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shoppp-fashion-staging")"
          TOKEN="$(jq -er '.value' <<<"$RESPONSE")"
          echo "::add-mask::$TOKEN"
          SHOPPP_GITHUB_OIDC_TOKEN="$TOKEN" bun tools/verify-github-oidc-claims.ts
      - name: Verify exact completed preparation provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PREPARATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$OPERATOR_RUN_ID"
          test -n "$PREPARATION_ARTIFACT_NAME"
          mkdir -p artifacts/fashion-u8
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARATION_RUN_ID" > artifacts/fashion-u8/preparation-run.json
          jq --exit-status --arg harness "${{ inputs.harness_sha }}" --arg artifact "$PREPARATION_ARTIFACT_NAME" \
            '.path == ".github/workflows/prepare-fashion-staging-u8.yml" and .event == "workflow_dispatch" and
             .head_sha == $harness and .status == "completed" and .conclusion == "success" and
             $artifact == ("fashion-u8-awaiting-operator-" + (.id | tostring) + "-" + (.run_attempt | tostring))' \
            artifacts/fashion-u8/preparation-run.json >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          name: ${{ inputs.preparation_artifact_name }}
          path: artifacts/fashion-u8
          run-id: ${{ inputs.preparation_run_id }}
      - name: Read immutable server-side operator approval and create successor build
        id: refresh
        env:
          ADMIN_SERVICE_TOKEN: ${{ secrets.FASHION_U12_ADMIN_SERVICE_TOKEN }}
          FASHION_U12_ACCEPTANCE_TOKEN: ${{ secrets.FASHION_U12_ACCEPTANCE_TOKEN }}
        run: |
          test "${#ADMIN_SERVICE_TOKEN}" -ge 32
          jq --exit-status --arg run "$OPERATOR_RUN_ID" --arg candidate "${{ inputs.candidate_sha }}" \
            --arg harness "${{ inputs.harness_sha }}" \
            '.schemaVersion == 2 and .status == "awaiting_operator" and .runId == $run and
             .candidateSha == $candidate and .harnessSha == $harness' \
            artifacts/fashion-u8/run-manifest.json >/dev/null
          RUN_MANIFEST_DIGEST="$(sha256sum artifacts/fashion-u8/run-manifest.json | cut -d ' ' -f 1)"
          curl --connect-timeout 10 --max-time 60 --fail --silent --show-error \
            --header "Authorization: Bearer $FASHION_U12_ACCEPTANCE_TOKEN" \
            "$API_ORIGIN/internal/testing/fashion-staging/operator-runs/$OPERATOR_RUN_ID" \
            > artifacts/fashion-u8/operator-run-approved.json
          jq --exit-status --arg digest "$RUN_MANIFEST_DIGEST" \
            '.data.status == "approved" and .data.runManifestDigest == $digest and
             (.data.operatorIdentityId | type == "string") and
             (.data.successorSnapshotId | type == "string") and
             (.data.successorContentDigest | test("^[a-f0-9]{64}$")) and
             (.data.approvalAuditId | type == "string")' \
            artifacts/fashion-u8/operator-run-approved.json >/dev/null
          SNAPSHOT_ID="$(jq -er '.data.successorSnapshotId' artifacts/fashion-u8/operator-run-approved.json)"
          CATALOG_RELEASE_ID="$(jq -er '.catalogReleaseId' artifacts/fashion-u8/run-manifest.json)"
          curl --connect-timeout 10 --max-time 60 --fail --silent --show-error \
            --request POST --header "Authorization: Bearer $ADMIN_SERVICE_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: fashion-u8-refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data '{"catalogReleaseId":"'"$CATALOG_RELEASE_ID"'","manualDispatch":true}' \
            "$API_ORIGIN/admin/storefront-experiences/snapshots/$SNAPSHOT_ID/build" \
            > artifacts/fashion-u8/build.json
          jq --exit-status --arg snapshot "$SNAPSHOT_ID" --arg catalog "$CATALOG_RELEASE_ID" \
            '.data.status == "building" and .data.snapshotId == $snapshot and
             .data.inputIdentity.experienceSnapshotId == $snapshot and
             .data.inputIdentity.catalogReleaseId == $catalog' artifacts/fashion-u8/build.json >/dev/null
          jq --null-input --sort-keys \
            --slurpfile manifest artifacts/fashion-u8/run-manifest.json \
            --slurpfile approval artifacts/fashion-u8/operator-run-approved.json \
            --slurpfile build artifacts/fashion-u8/build.json \
            --arg runManifestDigest "$RUN_MANIFEST_DIGEST" \
            --arg createdAt "$(node -e 'process.stdout.write(new Date().toISOString())')" \
            '{schemaVersion:1,candidateSha:$manifest[0].candidateSha,harnessSha:$manifest[0].harnessSha,
              harnessManifestDigest:$manifest[0].harnessManifestDigest,contractTestDigest:$manifest[0].contractTestDigest,
              runManifestDigest:$runManifestDigest,u12ArtifactDigest:$manifest[0].u12ArtifactDigest,
              u12ReadinessDigest:$manifest[0].u12ReadinessDigest,u12ReadinessCommitSha:$manifest[0].u12ReadinessCommitSha,
              u12ReadinessRunId:$manifest[0].u12ReadinessRunId,u12SnapshotId:$manifest[0].u12SnapshotId,
              operatorRunId:$manifest[0].runId,operatorIdentityId:$approval[0].data.operatorIdentityId,
              successorSnapshotId:$approval[0].data.successorSnapshotId,
              successorContentDigest:$approval[0].data.successorContentDigest,
              successorAuditId:$approval[0].data.approvalAuditId,catalogReleaseId:$manifest[0].catalogReleaseId,
              newBuildId:$build[0].data.id,experienceVersion:$build[0].data.inputIdentity.experienceVersion,
              platformContractVersion:$build[0].data.inputIdentity.platformContractVersion,
              themeId:$build[0].data.inputIdentity.themeId,themeVersion:$build[0].data.inputIdentity.themeVersion,
              createdAt:$createdAt}' > artifacts/fashion-u8/refresh-attestation.json
          printf 'build_id=%s\n' "$(jq -er '.data.id' artifacts/fashion-u8/build.json)" >> "$GITHUB_OUTPUT"
          printf 'snapshot_id=%s\n' "$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          printf 'refresh_digest=%s\n' "$(sha256sum artifacts/fashion-u8/refresh-attestation.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Record the explicit authorized Preview dispatch boundary
        env:
          BUILD_ID: ${{ steps.refresh.outputs.build_id }}
          REFRESH_DIGEST: ${{ steps.refresh.outputs.refresh_digest }}
          SNAPSHOT_ID: ${{ steps.refresh.outputs.snapshot_id }}
        run: |
          jq --null-input --sort-keys \
            --arg buildId "$BUILD_ID" \
            --arg snapshotId "$SNAPSHOT_ID" \
            --arg candidateSha "${{ inputs.candidate_sha }}" \
            --arg readinessCommitSha "${{ inputs.u12_readiness_commit_sha }}" \
            --arg readinessRunId "${{ inputs.u12_readiness_run_id }}" \
            --arg readinessDigest "${{ inputs.u12_readiness_digest }}" \
            --arg refreshRunId "$GITHUB_RUN_ID" \
            --arg refreshArtifactName "$REFRESH_ARTIFACT_NAME" \
            --arg refreshDigest "$REFRESH_DIGEST" \
            --arg harnessSha "${{ inputs.harness_sha }}" \
            '{schemaVersion:1,workflow:"preview-storefront.yml",ref:"main",
              buildId:$buildId,snapshotId:$snapshotId,candidateSha:$candidateSha,
              readinessCommitSha:$readinessCommitSha,readinessRunId:$readinessRunId,
              readinessDigest:$readinessDigest,refreshRunId:$refreshRunId,
              refreshArtifactName:$refreshArtifactName,refreshDigest:$refreshDigest,
              harnessSha:$harnessSha}' > artifacts/fashion-u8/preview-dispatch.json
          jq --exit-status \
            --arg build "$BUILD_ID" --arg snapshot "$SNAPSHOT_ID" \
            --arg candidate "${{ inputs.candidate_sha }}" --arg harness "${{ inputs.harness_sha }}" \
            --arg refreshRun "$GITHUB_RUN_ID" --arg refreshArtifact "$REFRESH_ARTIFACT_NAME" \
            --arg refreshDigest "$REFRESH_DIGEST" \
            '.schemaVersion == 1 and .workflow == "preview-storefront.yml" and .ref == "main" and
             .buildId == $build and .snapshotId == $snapshot and .candidateSha == $candidate and
             .harnessSha == $harness and .refreshRunId == $refreshRun and
             .refreshArtifactName == $refreshArtifact and .refreshDigest == $refreshDigest and
             (.readinessCommitSha | test("^[a-f0-9]{40}$")) and
             (.readinessRunId | test("^[1-9][0-9]*$")) and
             (.readinessDigest | test("^[a-f0-9]{64}$"))' \
            artifacts/fashion-u8/preview-dispatch.json >/dev/null
          printf 'An authorized Fashion staging operator must separately dispatch `%s` from exact `main` using `preview-dispatch.json`.\n' \
            "preview-storefront.yml" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.REFRESH_ARTIFACT_NAME }}
          path: |
            artifacts/fashion-u8/refresh-attestation.json
            artifacts/fashion-u8/run-manifest.json
            artifacts/fashion-u8/operator-run-approved.json
            artifacts/fashion-u8/harness-manifest.json
            artifacts/fashion-u8/preview-dispatch.json
          if-no-files-found: error
          retention-days: 30
