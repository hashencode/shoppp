name: Deploy immutable commerce release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to validate and deploy; defaults to this protected workflow commit
        required: false
        type: string
      source_ref:
        description: Governed frozen-candidate ref when the source is not on the default branch
        required: false
        type: string
      release_id:
        description: Approved immutable catalog release ID
        required: true
        type: string
      promote_production:
        description: Promote the proven candidate to production
        required: true
        default: false
        type: boolean
      rehearse_staging_rollback:
        description: Restore the exact captured staging Worker versions after proof; refuses pending D1 migrations
        required: true
        default: false
        type: boolean
      production_confirmation:
        description: Type PROMOTE <release-id> when production promotion is intended
        required: false
        type: string
      production_backup_id:
        description: Recent approved production backup ID
        required: false
        type: string
      human_access_evidence_id:
        description: External evidence ID for the real-human password-login proof
        required: false
        type: string

concurrency:
  group: commerce-production
  cancel-in-progress: false

permissions:
  actions: none
  contents: none

env:
  RELEASE_ID: ${{ inputs.release_id }}
  RELEASE_TAG: release-${{ inputs.source_sha || github.sha }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FROZEN_CANDIDATE_REF: ${{ vars.FROZEN_CANDIDATE_REF }}
      RELEASE_OPERATORS: ${{ vars.RELEASE_OPERATORS }}
      REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
      REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out protected deployment authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Set up trusted preflight runtime
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - name: Refuse production promotion during a staging rollback rehearsal
        if: ${{ inputs.rehearse_staging_rollback && inputs.promote_production }}
        run: |
          echo "A staging rollback rehearsal cannot promote production." >&2
          exit 1
      - name: Verify trusted deployment request before credentials
        id: request
        run: bun tools/ci-trusted-source-preflight.ts --mode deploy

  validate:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/full-validation.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      source_ref: ${{ inputs.source_ref }}
      release_id: ${{ inputs.release_id }}
    secrets:
      BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}

  verify-deployment-inputs:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out protected deployment verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
      - name: Verify deployment inputs with protected code
        env:
          EXPECTED_ATTESTATION_DIGEST: ${{ needs.validate.outputs.attestation_digest }}
          EXPECTED_DEPLOYABLE_DIGEST: ${{ needs.validate.outputs.deployable_digest }}
          EXPECTED_REPORT_DIGEST: ${{ needs.validate.outputs.report_digest }}
          RELEASE_EXPECTED_COMMIT: ${{ needs.validate.outputs.source_sha }}
          RELEASE_EXPECTED_TREE: ${{ needs.validate.outputs.source_tree }}
          RELEASE_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun tools/release-validate.ts --verify-attestation

  record-validation-failure:
    needs: [preflight, validate]
    if: ${{ always() && needs.preflight.result == 'success' && needs.validate.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    permissions: {}
    steps:
      - name: Record failed candidate validation
        env:
          API_URL: ${{ vars.API_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $BUILD_MANIFEST_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-validation-failed" \
            --data '{"status":"failed","failureCode":"candidate_validation_failed"}' \
            "$API_URL/build/catalog/releases/$RELEASE_ID/status"

  deploy-staging:
    needs: [validate, verify-deployment-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      actions: read
      contents: read
    outputs:
      baseline_artifact_id: ${{ steps.staging-baseline.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
      - name: Verify exact validated deployment inputs
        id: validated-inputs
        env:
          EXPECTED_ATTESTATION_DIGEST: ${{ needs.validate.outputs.attestation_digest }}
          EXPECTED_DEPLOYABLE_DIGEST: ${{ needs.validate.outputs.deployable_digest }}
          EXPECTED_REPORT_DIGEST: ${{ needs.validate.outputs.report_digest }}
          RELEASE_EXPECTED_COMMIT: ${{ needs.validate.outputs.source_sha }}
          RELEASE_EXPECTED_TREE: ${{ needs.validate.outputs.source_tree }}
          RELEASE_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun tools/release-validate.ts --verify-attestation
      - name: Capture exact staging Worker and D1 baseline
        if: ${{ inputs.rehearse_staging_rollback }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun tools/staging-rollback-baseline.ts capture \
            --output="artifacts/staging-baseline/baseline-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json" \
            --release-id="$RELEASE_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --run-id="$GITHUB_RUN_ID" \
            --source-sha="${{ needs.validate.outputs.source_sha }}"
      - name: Preserve the exact staging rollback baseline
        id: staging-baseline
        if: ${{ inputs.rehearse_staging_rollback }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-baseline-${{ inputs.release_id }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/staging-baseline/
      - name: Export test D1 before staging migration
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p ../../artifacts/d1-backups
          bunx wrangler d1 export shoppp-staging --env staging --remote \
            --output="../../artifacts/d1-backups/test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql"
      - name: Preserve the pre-migration test D1 export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-d1-backup-${{ inputs.release_id }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/d1-backups/
      - name: List pending test D1 migrations and refuse unsafe rehearsal
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REHEARSE_STAGING_ROLLBACK: ${{ inputs.rehearse_staging_rollback }}
        run: |
          migrations_output="$(bunx wrangler d1 migrations list shoppp-staging --env staging --remote 2>&1)"
          printf '%s\n' "$migrations_output"
          if test "$REHEARSE_STAGING_ROLLBACK" = "true"; then
            printf '%s\n' "$migrations_output" | \
              bun ../../tools/staging-rollback-baseline.ts check-migrations
          fi
      - name: Upload saved staging versions before migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd apps/api && bunx wrangler versions upload dist/index.js --env staging --no-bundle --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
          (cd apps/admin && bunx wrangler versions upload worker-dist/index.js --env staging --no-bundle --assets dist --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
          (cd apps/storefront && bunx wrangler versions upload worker-dist/index.js --env staging --no-bundle --assets .output/public --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
      - name: Verify test protected administrator before migration
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          schema_json="$(bunx wrangler d1 execute shoppp-staging --env staging --remote --json --command "SELECT COUNT(*) AS dynamic_iam FROM sqlite_master WHERE type = 'table' AND name = 'admin_roles'")"
          dynamic_iam="$(jq --exit-status --raw-output 'first(.[]?.results[]?.dynamic_iam) | tonumber' <<<"$schema_json")"
          if [ "$dynamic_iam" -eq 1 ]; then
            protected_admin_json="$(bunx wrangler d1 execute shoppp-staging --env staging --remote --json --command "
              SELECT COUNT(*) AS enabled_protected_admins
                FROM admin_identities identity
                JOIN admin_roles role ON role.id = identity.role_id
               WHERE identity.principal_kind = 'human'
                 AND identity.enabled = 1
                 AND role.enabled = 1
                 AND role.protected = 1
            ")"
          else
            protected_admin_json="$(bunx wrangler d1 execute shoppp-staging --env staging --remote --json --command "
              SELECT COUNT(*) AS enabled_protected_admins
                FROM admin_identities
               WHERE enabled = 1 AND role = 'admin'
            ")"
          fi
          jq --exit-status 'any(.[]?.results[]?; ((.enabled_protected_admins // 0) | tonumber) > 0)' \
            <<<"$protected_admin_json" >/dev/null
      - name: Apply test D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler d1 migrations apply shoppp-staging --env staging --remote
      - name: Verify test D1 integrity and protected administrator
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          foreign_key_json="$(bunx wrangler d1 execute shoppp-staging --env staging --remote --json --command "PRAGMA foreign_key_check")"
          jq --exit-status 'all(.[]?; ((.results // []) | length == 0))' <<<"$foreign_key_json" >/dev/null
          protected_admin_json="$(bunx wrangler d1 execute shoppp-staging --env staging --remote --json --command "
            SELECT COUNT(*) AS enabled_protected_admins
              FROM admin_identities identity
              JOIN admin_roles role ON role.id = identity.role_id
             WHERE identity.principal_kind = 'human'
               AND identity.enabled = 1
               AND role.enabled = 1
               AND role.protected = 1
          ")"
          jq --exit-status 'any(.[]?.results[]?; ((.enabled_protected_admins // 0) | tonumber) > 0)' \
            <<<"$protected_admin_json" >/dev/null
          credentialed_admin_json="$(bunx wrangler d1 execute shoppp-staging --env staging --remote --json --command "
            SELECT COUNT(*) AS credentialed_protected_admins
              FROM admin_identities identity
              JOIN admin_roles role ON role.id = identity.role_id
              JOIN admin_password_credentials credential ON credential.identity_id = identity.id
             WHERE identity.principal_kind = 'human'
               AND identity.enabled = 1
               AND role.enabled = 1
               AND role.protected = 1
               AND credential.password_version > 0
          ")"
          jq --exit-status 'any(.[]?.results[]?; ((.credentialed_protected_admins // 0) | tonumber) > 0)' \
            <<<"$credentialed_admin_json" >/dev/null
      - name: Deploy saved staging versions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd apps/api && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID" --yes)
          (cd apps/admin && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID" --yes)
          (cd apps/storefront && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID" --yes)
      - name: Record failed staging deployment
        if: ${{ failure() && steps.validated-inputs.outcome == 'success' && !inputs.rehearse_staging_rollback }}
        env:
          API_URL: ${{ vars.API_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $BUILD_MANIFEST_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-deployment-failed" \
            --data '{"status":"failed","failureCode":"staging_deployment_failed"}' \
            "$API_URL/build/catalog/releases/$RELEASE_ID/status"

  prove-staging:
    needs: [validate, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API_E2E_BASE_URL: ${{ vars.API_URL }}
      ADMIN_E2E_BASE_URL: ${{ vars.ADMIN_URL }}
      BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
      STOREFRONT_E2E_BASE_URL: ${{ vars.STOREFRONT_URL }}
      E2E_ADMIN_SERVICE_TOKEN: ${{ secrets.ADMIN_SERVICE_TOKEN }}
      E2E_ADMIN_SERVICE_SUBJECT: ${{ vars.ADMIN_SERVICE_SUBJECT }}
      E2E_STRIPE_TEST_CARD: ${{ secrets.STRIPE_TEST_CARD }}
      E2E_OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
      E2E_PROHIBITED_ADMIN_SERVICE_TOKEN: ${{ secrets.PROHIBITED_ADMIN_SERVICE_TOKEN }}
      E2E_PROHIBITED_ADMIN_SERVICE_SUBJECT: ${{ vars.PROHIBITED_ADMIN_SERVICE_SUBJECT }}
      E2E_ORDER_REFERENCE: ${{ vars.ORDER_REFERENCE }}
      E2E_PRODUCT_SLUG: ${{ vars.PRODUCT_SLUG }}
      STAGING_CHECKOUT_CONCURRENCY: "4"
      E2E_EXHAUSTED_NOTIFICATION_ID: proof-notification-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_FAILED_CATALOG_RELEASE_ID: proof-catalog-failure-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_LAST_KNOWN_GOOD_RELEASE_ID: ${{ vars.LAST_KNOWN_GOOD_RELEASE_ID }}
      E2E_ADMIN_ACCESS_PROOF_ID: access-proof-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ADMIN_ACCESS_PROOF_EMAIL: admin-proof+${{ github.run_id }}-${{ github.run_attempt }}@example.test
      E2E_BUYER_EMAIL: release-buyer+${{ github.run_id }}-${{ github.run_attempt }}@example.test
      CI_GH_VALIDATED_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      CI_GH_STAGING_REHEARSAL: ${{ inputs.rehearse_staging_rollback }}
      CI_GH_PRODUCTION_PROMOTION: ${{ inputs.promote_production }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Provision hashed staging service credential
        env:
          ADMIN_SERVICE_TOKEN: ${{ secrets.ADMIN_SERVICE_TOKEN }}
        run: >-
          bun run provision:admin-service --environment test --database shoppp-staging
          --subject "$E2E_ADMIN_SERVICE_SUBJECT" --name "Staging release automation"
      - name: Provision hashed staging prohibited service credential
        env:
          ADMIN_SERVICE_TOKEN: ${{ secrets.PROHIBITED_ADMIN_SERVICE_TOKEN }}
        run: >-
          bun run provision:admin-service --environment test --database shoppp-staging
          --subject "$E2E_PROHIBITED_ADMIN_SERVICE_SUBJECT"
          --name "Staging prohibited automation"
      - name: Verify staging administrator auth secret
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Origin: $ADMIN_E2E_BASE_URL" \
            --header "Sec-Fetch-Site: same-origin" \
            --data '{"email":"release-auth-secret-proof@example.test"}' \
            "$ADMIN_E2E_BASE_URL/api/admin/auth/password-reset/request" >/dev/null
      - name: Prepare representative last-unit inventory
        run: |
          PROOF_INVENTORY_JSON="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $E2E_ADMIN_SERVICE_TOKEN" \
            "$ADMIN_E2E_BASE_URL/api/admin/inventory?query=ATLAS-BLK&pageSize=1")"
          PROOF_INVENTORY_AVAILABLE="$(jq -er '.data[0].available' <<<"$PROOF_INVENTORY_JSON")"
          PROOF_INVENTORY_VARIANT="$(jq -er '.data[0].variantId' <<<"$PROOF_INVENTORY_JSON")"
          PROOF_INVENTORY_WAREHOUSE="$(jq -er '.data[0].warehouseId' <<<"$PROOF_INVENTORY_JSON")"
          PROOF_INVENTORY_DELTA="$((1 - PROOF_INVENTORY_AVAILABLE))"
          if [ "$PROOF_INVENTORY_DELTA" -ne 0 ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $E2E_ADMIN_SERVICE_TOKEN" \
              --header "Content-Type: application/json" \
              --header "Idempotency-Key: staging-last-unit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --data "{\"quantityDelta\":$PROOF_INVENTORY_DELTA,\"reason\":\"Staging release last-unit fixture\"}" \
              "$ADMIN_E2E_BASE_URL/api/admin/inventory/$PROOF_INVENTORY_VARIANT/$PROOF_INVENTORY_WAREHOUSE/adjustments"
          fi
      - name: Seed isolated staging journey fixtures
        working-directory: apps/api
        run: |
          bunx wrangler d1 execute shoppp-staging --env staging --remote --command "
            INSERT INTO catalog_releases
              (id, status, manifest_json, approved_at, failure_code, build_correlation_id,
               product_id, created_at, updated_at)
            SELECT '$E2E_FAILED_CATALOG_RELEASE_ID', 'failed', '{}',
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
                   'release_proof_synthetic', '$E2E_FAILED_CATALOG_RELEASE_ID',
                   id, strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
              FROM products
             WHERE slug = '$E2E_PRODUCT_SLUG';
            INSERT INTO notification_jobs
              (id, order_id, type, deduplication_key, payload_json, status, attempt_count,
               last_error_code, created_at, updated_at, max_attempts, attempt_cycle_count,
               dead_lettered_at)
            SELECT '$E2E_EXHAUSTED_NOTIFICATION_ID', id, 'order_receipt',
                   '$E2E_EXHAUSTED_NOTIFICATION_ID', json_object('orderId', id),
                   'dead_letter', 3, 'release_proof_synthetic',
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), 3, 3,
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
              FROM orders
             WHERE public_reference = '$E2E_ORDER_REFERENCE';
            INSERT OR IGNORE INTO admin_invitations
              (id, normalized_email, display_name, role_id, status, idempotency_key,
               invited_by_id, expires_at, version, created_at, updated_at)
            VALUES
              ('inv_$E2E_ADMIN_ACCESS_PROOF_ID', '$E2E_ADMIN_ACCESS_PROOF_EMAIL',
               'Release access proof', 'role_support', 'pending',
               '$E2E_ADMIN_ACCESS_PROOF_ID', NULL,
               strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '+1 day'), 1,
               strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
               strftime('%Y-%m-%dT%H:%M:%fZ', 'now'));
          "
      - name: Prove service-principal admin access
        run: bunx playwright test e2e/admin-access.spec.ts
      - name: Activate staging proof Catalog Release
        working-directory: apps/api
        run: |
          result="$(bunx wrangler d1 execute shoppp-staging --env staging --remote --json --command "
            UPDATE catalog_releases
               SET build_correlation_id = 'staging-proof:' || build_correlation_id,
                   updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
             WHERE id = '$RELEASE_ID' AND status = 'building'
               AND build_correlation_id NOT LIKE 'staging-proof:%';
            SELECT status, build_correlation_id FROM catalog_releases WHERE id = '$RELEASE_ID';
          ")"
          jq -e 'any(.[]?.results[]?; .status == "building" and (.build_correlation_id | startswith("staging-proof:")))' <<<"$result" >/dev/null
      - name: Verify public and protected deployment boundaries
        run: bunx playwright test --config e2e/playwright.config.ts
      - name: Remove transient staging proof fixtures
        if: always()
        working-directory: apps/api
        run: |
          bunx wrangler d1 execute shoppp-staging --env staging --remote \
            --command "
              DELETE FROM catalog_releases
               WHERE id = '$E2E_FAILED_CATALOG_RELEASE_ID'
                 AND failure_code = 'release_proof_synthetic';
              DELETE FROM notification_jobs
               WHERE id = '$E2E_EXHAUSTED_NOTIFICATION_ID'
                 AND status = 'dead_letter'
                 AND last_error_code = 'release_proof_synthetic';
              DELETE FROM admin_invitations
               WHERE id = 'inv_$E2E_ADMIN_ACCESS_PROOF_ID'
                 AND normalized_email = '$E2E_ADMIN_ACCESS_PROOF_EMAIL';
            "
      - name: Enforce staging API p95 targets
        run: bun tools/verify-release-staging-latency.ts
      - name: Verify last-known-good rollback artifacts remain available
        run: |
          for component in apps/api apps/admin apps/storefront; do
            versions="$(cd "$component" && bunx wrangler versions list --env staging --json)"
            jq -e --arg release "$E2E_LAST_KNOWN_GOOD_RELEASE_ID" \
              'any(.[]; .annotations["workers/message"] == $release)' \
              <<<"$versions" >/dev/null
          done
      - name: Record proven catalog deployment
        if: ${{ !inputs.rehearse_staging_rollback }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $BUILD_MANIFEST_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-deployed" \
            --data '{"status":"deployed"}' \
            "$API_E2E_BASE_URL/build/catalog/releases/$RELEASE_ID/status"
      - name: Record failed staging proof
        if: ${{ failure() && !inputs.rehearse_staging_rollback }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $BUILD_MANIFEST_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-staging-proof-failed" \
            --data '{"status":"failed","failureCode":"staging_proof_failed"}' \
            "$API_E2E_BASE_URL/build/catalog/releases/$RELEASE_ID/status"
      - name: Preserve staging journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-evidence-${{ inputs.release_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  restore-staging-baseline:
    needs: [validate, deploy-staging, prove-staging]
    if: ${{ always() && inputs.rehearse_staging_rollback && needs.deploy-staging.outputs.baseline_artifact_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      actions: read
      contents: read
    env:
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      API_URL: ${{ vars.API_URL }}
      BASELINE_FILE: artifacts/staging-baseline/baseline-${{ github.run_id }}-attempt-${{ github.run_attempt }}.json
      STOREFRONT_URL: ${{ vars.STOREFRONT_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-baseline-${{ inputs.release_id }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/staging-baseline
      - name: Validate captured staging baseline identity before restoration
        id: baseline-validation
        run: |
          bun tools/staging-rollback-baseline.ts validate \
            --baseline="$BASELINE_FILE" \
            --release-id="$RELEASE_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --run-id="$GITHUB_RUN_ID" \
            --source-sha="${{ needs.validate.outputs.source_sha }}"
      - name: Restore exact captured staging Worker versions
        id: worker-restoration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p artifacts/staging-restoration
          : > artifacts/staging-restoration/worker-restore-outcomes.txt
          restore_failed=0
          for component in api admin storefront; do
            version_id="$(jq --exit-status --raw-output --arg component "$component" \
              '.workers[$component] | select(test("^[0-9a-fA-F-]{36}$"))' "$BASELINE_FILE")"
            restored=false
            for attempt in 1 2 3; do
              if (cd "apps/$component" && bunx wrangler versions deploy "$version_id@100%" \
                --env staging --message "restore baseline after $RELEASE_ID rehearsal" --yes); then
                restored=true
                break
              fi
              sleep "$((attempt * 5))"
            done
            printf '%s=%s\n' "$component" "$restored" | \
              tee -a artifacts/staging-restoration/worker-restore-outcomes.txt
            if test "$restored" != "true"; then
              restore_failed=1
            fi
          done
          test "$restore_failed" -eq 0
      - name: Restore rehearsal Catalog Release lifecycle
        id: release-lifecycle-restoration
        if: ${{ always() && steps.baseline-validation.outcome == 'success' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          result="$(bunx wrangler d1 execute shoppp-staging --env staging --remote --json --command "
            UPDATE catalog_releases
               SET build_correlation_id = substr(build_correlation_id, length('staging-proof:') + 1),
                   updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
             WHERE id = '$RELEASE_ID' AND status = 'building'
               AND build_correlation_id LIKE 'staging-proof:%';
            SELECT status, build_correlation_id FROM catalog_releases WHERE id = '$RELEASE_ID';
          ")"
          jq -e 'any(.[]?.results[]?; .status == "building" and (.build_correlation_id | startswith("staging-proof:") | not))' <<<"$result" >/dev/null
          mkdir -p ../../artifacts/staging-restoration
          printf 'release=%s\nstatus=building\nstagingProofMarker=false\n' "$RELEASE_ID" > \
            ../../artifacts/staging-restoration/release-lifecycle-restore.txt
      - name: Reconcile run-scoped staging proof data
        id: d1-reconciliation
        if: ${{ always() && steps.baseline-validation.outcome == 'success' && steps.release-lifecycle-restoration.outcome == 'success' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_BUYER_EMAIL: release-buyer+${{ github.run_id }}-${{ github.run_attempt }}@example.test
        run: |
          bun tools/staging-rollback-baseline.ts reconcile \
            --baseline="$BASELINE_FILE" \
            --buyer-email="$E2E_BUYER_EMAIL" \
            --release-id="$RELEASE_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --run-id="$GITHUB_RUN_ID" \
            --source-sha="${{ needs.validate.outputs.source_sha }}"
      - name: Verify restored staging Worker and D1 baseline
        id: restored-state
        if: ${{ always() && steps.baseline-validation.outcome == 'success' && steps.d1-reconciliation.outcome == 'success' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_BUYER_EMAIL: release-buyer+${{ github.run_id }}-${{ github.run_attempt }}@example.test
        run: |
          bun tools/staging-rollback-baseline.ts verify \
            --baseline="$BASELINE_FILE" \
            --buyer-email="$E2E_BUYER_EMAIL" \
            --output="artifacts/staging-restoration/result.json" \
            --release-id="$RELEASE_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --run-id="$GITHUB_RUN_ID" \
            --source-sha="${{ needs.validate.outputs.source_sha }}"
          curl --fail --silent --show-error "$API_URL/health" >/dev/null
          curl --fail --silent --show-error "$ADMIN_URL/" >/dev/null
          curl --fail --silent --show-error "$STOREFRONT_URL/" >/dev/null
      - name: Record proven catalog deployment after restored safe state
        if: ${{ needs.deploy-staging.result == 'success' && needs.prove-staging.result == 'success' && steps.worker-restoration.outcome == 'success' && steps.release-lifecycle-restoration.outcome == 'success' && steps.d1-reconciliation.outcome == 'success' && steps.restored-state.outcome == 'success' }}
        env:
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $BUILD_MANIFEST_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-deployed" \
            --data '{"status":"deployed"}' \
            "$API_URL/build/catalog/releases/$RELEASE_ID/status"
      - name: Record one failed rehearsal outcome after restoration attempts
        if: ${{ always() && !(needs.deploy-staging.result == 'success' && needs.prove-staging.result == 'success' && steps.worker-restoration.outcome == 'success' && steps.release-lifecycle-restoration.outcome == 'success' && steps.d1-reconciliation.outcome == 'success' && steps.restored-state.outcome == 'success') }}
        env:
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          D1_RECONCILIATION_OUTCOME: ${{ steps.d1-reconciliation.outcome }}
          DEPLOY_OUTCOME: ${{ needs.deploy-staging.result }}
          PROOF_OUTCOME: ${{ needs.prove-staging.result }}
          RELEASE_LIFECYCLE_RESTORATION_OUTCOME: ${{ steps.release-lifecycle-restoration.outcome }}
          RESTORED_STATE_OUTCOME: ${{ steps.restored-state.outcome }}
          WORKER_RESTORATION_OUTCOME: ${{ steps.worker-restoration.outcome }}
        run: |
          failure_code=staging_restoration_failed
          if test "$WORKER_RESTORATION_OUTCOME" = "success" && \
             test "$RELEASE_LIFECYCLE_RESTORATION_OUTCOME" = "success" && \
             test "$D1_RECONCILIATION_OUTCOME" = "success" && \
             test "$RESTORED_STATE_OUTCOME" = "success"; then
            if test "$DEPLOY_OUTCOME" != "success"; then
              failure_code=staging_deployment_failed
            elif test "$PROOF_OUTCOME" != "success"; then
              failure_code=staging_proof_failed
            fi
          fi
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $BUILD_MANIFEST_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-staging-restoration-failed" \
            --data "{\"status\":\"failed\",\"failureCode\":\"$failure_code\"}" \
            "$API_URL/build/catalog/releases/$RELEASE_ID/status"
      - name: Preserve staging restoration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-restoration-${{ inputs.release_id }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: artifacts/staging-restoration/

  approve-human-access:
    needs: prove-staging
    if: ${{ inputs.promote_production }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-human-access
    permissions:
      actions: read
      contents: none
    outputs:
      approved_by: ${{ steps.human-access.outputs.approved_by }}
      evidence_id: ${{ steps.human-access.outputs.evidence_id }}
    steps:
      - id: human-access
        name: Record real-human password-login proof
        env:
          GH_TOKEN: ${{ github.token }}
          HUMAN_ACCESS_EVIDENCE_ID: ${{ inputs.human_access_evidence_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          WORKFLOW_ACTOR: ${{ github.actor }}
        run: |
          [[ "$HUMAN_ACCESS_EVIDENCE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          review_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals")"
          approved_by="$(jq --raw-output '
            [.[]
             | select(.state == "approved")
             | select(any(.environments[]?; .name == "staging-human-access"))
             | .user.login]
            | last // empty
          ' <<<"$review_json")"
          evidence_source="environment-review"
          if [[ -z "$approved_by" ]]; then
            approved_by="$WORKFLOW_ACTOR"
            evidence_source="workflow-dispatch-actor"
          fi
          [[ "$approved_by" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          mkdir -p artifacts/access-evidence
          jq --null-input \
            --arg approvedBy "$approved_by" \
            --arg evidenceId "$HUMAN_ACCESS_EVIDENCE_ID" \
            --arg evidenceSource "$evidence_source" \
            --arg releaseId "$RELEASE_ID" \
            --arg runId "$GITHUB_RUN_ID" \
            '{approvedBy: $approvedBy, assertion: "real-human named test identity completed application password login; no password, cookie, or browser storage state was captured", evidenceId: $evidenceId, evidenceSource: $evidenceSource, releaseId: $releaseId, runId: $runId}' \
            > "artifacts/access-evidence/${HUMAN_ACCESS_EVIDENCE_ID}.json"
          printf 'approved_by=%s\n' "$approved_by" >> "$GITHUB_OUTPUT"
          printf 'evidence_id=%s\n' "$HUMAN_ACCESS_EVIDENCE_ID" >> "$GITHUB_OUTPUT"
      - name: Preserve human access evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-access-evidence-${{ inputs.release_id }}
          retention-days: 90
          if-no-files-found: error
          path: artifacts/access-evidence/

  approve-production:
    needs: [validate, prove-staging, approve-human-access]
    if: ${{ inputs.promote_production }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      approved_by: ${{ steps.approval.outputs.approved_by }}
      backup_id: ${{ steps.approval.outputs.backup_id }}
      human_access_approved_by: ${{ steps.approval.outputs.human_access_approved_by }}
      human_access_evidence_id: ${{ steps.approval.outputs.human_access_evidence_id }}
    steps:
      - id: approval
        name: Record explicit production approval
        env:
          APPROVED_BY: ${{ github.actor }}
          HUMAN_ACCESS_APPROVED_BY: ${{ needs.approve-human-access.outputs.approved_by }}
          HUMAN_ACCESS_EVIDENCE_ID: ${{ needs.approve-human-access.outputs.evidence_id }}
          PRODUCTION_BACKUP_ID: ${{ inputs.production_backup_id }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          test "$PRODUCTION_CONFIRMATION" = "PROMOTE $RELEASE_ID"
          [[ "$PRODUCTION_BACKUP_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          [[ "$HUMAN_ACCESS_APPROVED_BY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$HUMAN_ACCESS_EVIDENCE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          printf 'approved_by=%s\n' "$APPROVED_BY" >> "$GITHUB_OUTPUT"
          printf 'backup_id=%s\n' "$PRODUCTION_BACKUP_ID" >> "$GITHUB_OUTPUT"
          printf 'human_access_approved_by=%s\n' "$HUMAN_ACCESS_APPROVED_BY" >> "$GITHUB_OUTPUT"
          printf 'human_access_evidence_id=%s\n' "$HUMAN_ACCESS_EVIDENCE_ID" >> "$GITHUB_OUTPUT"

  promote-production:
    needs: [validate, verify-deployment-inputs, prove-staging, approve-production]
    if: ${{ inputs.promote_production }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Install font inspection runtime
        run: sudo apt-get install --yes woff2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
      - name: Verify exact validated production inputs
        env:
          EXPECTED_ATTESTATION_DIGEST: ${{ needs.validate.outputs.attestation_digest }}
          EXPECTED_DEPLOYABLE_DIGEST: ${{ needs.validate.outputs.deployable_digest }}
          EXPECTED_REPORT_DIGEST: ${{ needs.validate.outputs.report_digest }}
          RELEASE_EXPECTED_COMMIT: ${{ needs.validate.outputs.source_sha }}
          RELEASE_EXPECTED_TREE: ${{ needs.validate.outputs.source_tree }}
          RELEASE_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun tools/release-validate.ts --verify-attestation
      - name: Verify recent production backup before migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_BACKUP_ID: ${{ needs.approve-production.outputs.backup_id }}
        run: |
          backup_json="$(
            cd apps/api
            bunx wrangler d1 execute shoppp-production \
              --env production \
              --remote \
              --json \
              --command "SELECT id FROM d1_backup_runs WHERE id = '$PRODUCTION_BACKUP_ID' AND environment = 'production' AND status = 'ready' AND datetime(completed_at) >= datetime('now', '-24 hours') LIMIT 1"
          )"
          jq --exit-status \
            --arg id "$PRODUCTION_BACKUP_ID" \
            'any(.[]?.results[]?; .id == $id)' \
            <<< "$backup_json" >/dev/null
      - name: Revalidate approved promotion against staging evidence
        env:
          RELEASE_APPROVED_BY: ${{ needs.approve-production.outputs.approved_by }}
          RELEASE_BACKUP_ID: ${{ needs.approve-production.outputs.backup_id }}
          RELEASE_HUMAN_ACCESS_EVIDENCE_ID: ${{ needs.approve-production.outputs.human_access_evidence_id }}
          RELEASE_HUMAN_ACCESS_APPROVED_BY: ${{ needs.approve-production.outputs.human_access_approved_by }}
          RELEASE_STRICT_ENVIRONMENT: "true"
          RELEASE_TARGET: production
          STAGING_RELEASE_REPORT: artifacts/releases/${{ inputs.release_id }}.json
        run: bun run release:validate -- --promotion --release-id "${RELEASE_ID}-production"
      - name: Upload production-bound saved versions before migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd apps/api && bunx wrangler versions upload dist/index.js --env production --no-bundle --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
          (cd apps/admin && bunx wrangler versions upload worker-dist/index.js --env production --no-bundle --assets dist --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
          (cd apps/storefront && bunx wrangler versions upload worker-dist/index.js --env production --no-bundle --assets .output/public --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
      - name: List pending production D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler d1 migrations list shoppp-production --env production --remote
      - name: Verify two production protected administrators before migration
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          schema_json="$(bunx wrangler d1 execute shoppp-production --env production --remote --json --command "SELECT COUNT(*) AS dynamic_iam FROM sqlite_master WHERE type = 'table' AND name = 'admin_roles'")"
          dynamic_iam="$(jq --exit-status --raw-output 'first(.[]?.results[]?.dynamic_iam) | tonumber' <<<"$schema_json")"
          if [ "$dynamic_iam" -eq 1 ]; then
            protected_admin_json="$(bunx wrangler d1 execute shoppp-production --env production --remote --json --command "
              SELECT COUNT(*) AS enabled_protected_admins
                FROM admin_identities identity
                JOIN admin_roles role ON role.id = identity.role_id
               WHERE identity.principal_kind = 'human'
                 AND identity.enabled = 1
                 AND role.enabled = 1
                 AND role.protected = 1
            ")"
          else
            protected_admin_json="$(bunx wrangler d1 execute shoppp-production --env production --remote --json --command "
              SELECT COUNT(*) AS enabled_protected_admins
                FROM admin_identities
               WHERE enabled = 1 AND role = 'admin'
            ")"
          fi
          jq --exit-status 'any(.[]?.results[]?; ((.enabled_protected_admins // 0) | tonumber) > 1)' \
            <<<"$protected_admin_json" >/dev/null
      - name: Apply production D1 migrations after approved backup
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler d1 migrations apply shoppp-production --env production --remote
      - name: Verify production D1 integrity and protected administrator
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          foreign_key_json="$(bunx wrangler d1 execute shoppp-production --env production --remote --json --command "PRAGMA foreign_key_check")"
          jq --exit-status 'all(.[]?; ((.results // []) | length == 0))' <<<"$foreign_key_json" >/dev/null
          protected_admin_json="$(bunx wrangler d1 execute shoppp-production --env production --remote --json --command "
            SELECT COUNT(*) AS enabled_protected_admins
              FROM admin_identities identity
              JOIN admin_roles role ON role.id = identity.role_id
             WHERE identity.principal_kind = 'human'
               AND identity.enabled = 1
               AND role.enabled = 1
               AND role.protected = 1
          ")"
          jq --exit-status 'any(.[]?.results[]?; ((.enabled_protected_admins // 0) | tonumber) > 1)' \
            <<<"$protected_admin_json" >/dev/null
          credentialed_admin_json="$(bunx wrangler d1 execute shoppp-production --env production --remote --json --command "
            SELECT COUNT(*) AS credentialed_protected_admins
              FROM admin_identities identity
              JOIN admin_roles role ON role.id = identity.role_id
              JOIN admin_password_credentials credential ON credential.identity_id = identity.id
             WHERE identity.principal_kind = 'human'
               AND identity.enabled = 1
               AND role.enabled = 1
               AND role.protected = 1
               AND credential.password_version > 0
          ")"
          jq --exit-status 'any(.[]?.results[]?; ((.credentialed_protected_admins // 0) | tonumber) > 1)' \
            <<<"$credentialed_admin_json" >/dev/null
      - name: Deploy production versions after environment approval
        env:
          APPROVED_BY: ${{ needs.approve-production.outputs.approved_by }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_BACKUP_ID: ${{ needs.approve-production.outputs.backup_id }}
        run: |
          (cd apps/api && bunx wrangler versions deploy --env production --version-tag "$RELEASE_TAG" --message "$RELEASE_ID approved by $APPROVED_BY after backup $PRODUCTION_BACKUP_ID" --yes)
          (cd apps/admin && bunx wrangler versions deploy --env production --version-tag "$RELEASE_TAG" --message "$RELEASE_ID approved by $APPROVED_BY after backup $PRODUCTION_BACKUP_ID" --yes)
          (cd apps/storefront && bunx wrangler versions deploy --env production --version-tag "$RELEASE_TAG" --message "$RELEASE_ID approved by $APPROVED_BY after backup $PRODUCTION_BACKUP_ID" --yes)
