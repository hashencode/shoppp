name: Deploy immutable commerce release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Approved immutable catalog release ID
        required: true
        type: string
      promote_production:
        description: Promote the proven candidate to production
        required: true
        default: false
        type: boolean
      production_confirmation:
        description: Type PROMOTE <release-id> when production promotion is intended
        required: false
        type: string
      production_backup_id:
        description: Recent approved production backup ID
        required: false
        type: string

concurrency:
  group: commerce-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_ID: ${{ inputs.release_id }}
  RELEASE_TAG: release-${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      NUXT_CATALOG_RELEASE_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
      NUXT_CATALOG_RELEASE_URL: ${{ vars.API_URL }}/build/catalog/releases/${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install browser runtime
        run: bunx playwright install --with-deps chromium
      - name: Validate locked staging candidate
        env:
          RELEASE_STRICT_ENVIRONMENT: "true"
          RELEASE_TARGET: staging
        run: bun run release:validate -- --release-id "$RELEASE_ID"
      - name: Package the validated workspace and report
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ inputs.release_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/admin/dist/
            apps/admin/worker-dist/
            apps/api/dist/
            apps/storefront/.output/public/
            apps/storefront/worker-dist/
            artifacts/releases/${{ inputs.release_id }}.json
            packages/db/migrations/
      - name: Record failed candidate validation
        if: failure()
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $NUXT_CATALOG_RELEASE_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-validation-failed" \
            --data '{"status":"failed","failureCode":"candidate_validation_failed"}' \
            "$NUXT_CATALOG_RELEASE_URL/status"

  deploy-staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      API_URL: ${{ vars.API_URL }}
      BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: validated-${{ inputs.release_id }}
      - name: Apply staging D1 migrations
        working-directory: apps/api
        run: bunx wrangler d1 migrations apply DB --env staging --remote
      - name: Upload saved staging versions
        run: |
          (cd apps/api && bunx wrangler versions upload dist/index.js --env staging --no-bundle --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
          (cd apps/admin && bunx wrangler versions upload worker-dist/index.js --env staging --no-bundle --assets dist --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
          (cd apps/storefront && bunx wrangler versions upload worker-dist/index.js --env staging --no-bundle --assets .output/public --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
      - name: Deploy saved staging versions
        run: |
          (cd apps/api && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID" --yes)
          (cd apps/admin && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID" --yes)
          (cd apps/storefront && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID" --yes)
      - name: Record failed staging deployment
        if: failure()
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $BUILD_MANIFEST_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-deployment-failed" \
            --data '{"status":"failed","failureCode":"staging_deployment_failed"}' \
            "$API_URL/build/catalog/releases/$RELEASE_ID/status"

  prove-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      API_E2E_BASE_URL: ${{ vars.API_URL }}
      ADMIN_E2E_BASE_URL: ${{ vars.ADMIN_URL }}
      BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
      STOREFRONT_E2E_BASE_URL: ${{ vars.STOREFRONT_URL }}
      E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      E2E_STRIPE_TEST_CARD: ${{ secrets.STRIPE_TEST_CARD }}
      E2E_OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
      E2E_PROHIBITED_CF_ACCESS_CLIENT_ID: ${{ secrets.PROHIBITED_CF_ACCESS_CLIENT_ID }}
      E2E_PROHIBITED_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PROHIBITED_CF_ACCESS_CLIENT_SECRET }}
      E2E_ORDER_REFERENCE: ${{ vars.ORDER_REFERENCE }}
      E2E_PRODUCT_SLUG: ${{ vars.PRODUCT_SLUG }}
      STAGING_CHECKOUT_CONCURRENCY: "3"
      E2E_EXHAUSTED_NOTIFICATION_ID: proof-notification-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_FAILED_CATALOG_RELEASE_ID: proof-catalog-failure-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_LAST_KNOWN_GOOD_RELEASE_ID: ${{ vars.LAST_KNOWN_GOOD_RELEASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Prepare representative last-unit inventory
        run: |
          PROOF_INVENTORY_JSON="$(curl --fail --silent --show-error \
            --header "CF-Access-Client-Id: $E2E_CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $E2E_CF_ACCESS_CLIENT_SECRET" \
            "$ADMIN_E2E_BASE_URL/api/admin/inventory?query=ATLAS-BLK&pageSize=1")"
          PROOF_INVENTORY_AVAILABLE="$(jq -er '.data[0].available' <<<"$PROOF_INVENTORY_JSON")"
          PROOF_INVENTORY_VARIANT="$(jq -er '.data[0].variantId' <<<"$PROOF_INVENTORY_JSON")"
          PROOF_INVENTORY_WAREHOUSE="$(jq -er '.data[0].warehouseId' <<<"$PROOF_INVENTORY_JSON")"
          PROOF_INVENTORY_DELTA="$((1 - PROOF_INVENTORY_AVAILABLE))"
          if [ "$PROOF_INVENTORY_DELTA" -ne 0 ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "CF-Access-Client-Id: $E2E_CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $E2E_CF_ACCESS_CLIENT_SECRET" \
              --header "Content-Type: application/json" \
              --header "Idempotency-Key: staging-last-unit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --data "{\"quantityDelta\":$PROOF_INVENTORY_DELTA,\"reason\":\"Staging release last-unit fixture\"}" \
              "$ADMIN_E2E_BASE_URL/api/admin/inventory/$PROOF_INVENTORY_VARIANT/$PROOF_INVENTORY_WAREHOUSE/adjustments"
          fi
      - name: Seed isolated staging journey fixtures
        working-directory: apps/api
        run: |
          bunx wrangler d1 execute DB --env staging --remote --command "
            INSERT INTO catalog_releases
              (id, status, manifest_json, approved_at, failure_code, build_correlation_id,
               product_id, created_at, updated_at)
            SELECT '$E2E_FAILED_CATALOG_RELEASE_ID', 'failed', '{}',
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
                   'release_proof_synthetic', '$E2E_FAILED_CATALOG_RELEASE_ID',
                   id, strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
              FROM products
             WHERE slug = '$E2E_PRODUCT_SLUG';
            INSERT INTO notification_jobs
              (id, order_id, type, deduplication_key, payload_json, status, attempt_count,
               last_error_code, created_at, updated_at, max_attempts, attempt_cycle_count,
               dead_lettered_at)
            SELECT '$E2E_EXHAUSTED_NOTIFICATION_ID', id, 'order_receipt',
                   '$E2E_EXHAUSTED_NOTIFICATION_ID', json_object('orderId', id),
                   'dead_letter', 3, 'release_proof_synthetic',
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now'),
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), 3, 3,
                   strftime('%Y-%m-%dT%H:%M:%fZ', 'now')
              FROM orders
             WHERE public_reference = '$E2E_ORDER_REFERENCE';
          "
      - name: Verify public and protected deployment boundaries
        run: bunx playwright test --config e2e/playwright.config.ts
      - name: Remove transient staging proof fixtures
        if: always()
        working-directory: apps/api
        run: |
          bunx wrangler d1 execute DB --env staging --remote \
            --command "
              DELETE FROM catalog_releases
               WHERE id = '$E2E_FAILED_CATALOG_RELEASE_ID'
                 AND failure_code = 'release_proof_synthetic';
              DELETE FROM notification_jobs
               WHERE id = '$E2E_EXHAUSTED_NOTIFICATION_ID'
                 AND status = 'dead_letter'
                 AND last_error_code = 'release_proof_synthetic';
            "
      - name: Enforce staging API p95 targets
        run: bun run test:staging-latency
      - name: Demonstrate last-known-good rollback
        run: |
          (cd apps/api && bunx wrangler rollback --env staging --message "$RELEASE_ID rollback rehearsal" --yes)
          (cd apps/admin && bunx wrangler rollback --env staging --message "$RELEASE_ID rollback rehearsal" --yes)
          (cd apps/storefront && bunx wrangler rollback --env staging --message "$RELEASE_ID rollback rehearsal" --yes)
          curl --fail --silent --show-error "$API_E2E_BASE_URL/health"
          curl --fail --silent --show-error "$STOREFRONT_E2E_BASE_URL/"
          curl --fail --silent --show-error \
            -H "CF-Access-Client-Id: $E2E_CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $E2E_CF_ACCESS_CLIENT_SECRET" \
            "$ADMIN_E2E_BASE_URL/"
      - name: Restore the validated staging versions
        run: |
          (cd apps/api && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID rehearsal restore" --yes)
          (cd apps/admin && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID rehearsal restore" --yes)
          (cd apps/storefront && bunx wrangler versions deploy --env staging --version-tag "$RELEASE_TAG" --message "$RELEASE_ID rehearsal restore" --yes)
      - name: Record proven catalog deployment
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $BUILD_MANIFEST_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: catalog-build-$RELEASE_ID-deployed" \
            --data '{"status":"deployed"}' \
            "$API_E2E_BASE_URL/build/catalog/releases/$RELEASE_ID/status"
      - name: Preserve staging journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ inputs.release_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
  approve-production:
    needs: [validate, prove-staging]
    if: ${{ inputs.promote_production }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_by: ${{ steps.approval.outputs.approved_by }}
      backup_id: ${{ steps.approval.outputs.backup_id }}
    steps:
      - id: approval
        name: Record explicit production approval
        env:
          APPROVED_BY: ${{ github.actor }}
          PRODUCTION_BACKUP_ID: ${{ inputs.production_backup_id }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          test "$PRODUCTION_CONFIRMATION" = "PROMOTE $RELEASE_ID"
          [[ "$PRODUCTION_BACKUP_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          printf 'approved_by=%s\n' "$APPROVED_BY" >> "$GITHUB_OUTPUT"
          printf 'backup_id=%s\n' "$PRODUCTION_BACKUP_ID" >> "$GITHUB_OUTPUT"

  promote-production:
    needs: [validate, prove-staging, approve-production]
    if: ${{ inputs.promote_production }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: validated-${{ inputs.release_id }}
      - name: Verify recent production backup before migration
        env:
          PRODUCTION_BACKUP_ID: ${{ needs.approve-production.outputs.backup_id }}
        run: |
          backup_json="$(
            cd apps/api
            bunx wrangler d1 execute DB \
              --env production \
              --remote \
              --json \
              --command "SELECT id FROM d1_backup_runs WHERE id = '$PRODUCTION_BACKUP_ID' AND environment = 'production' AND status = 'ready' AND datetime(completed_at) >= datetime('now', '-24 hours') LIMIT 1"
          )"
          jq --exit-status \
            --arg id "$PRODUCTION_BACKUP_ID" \
            'any(.[]?.results[]?; .id == $id)' \
            <<< "$backup_json" >/dev/null
      - name: Revalidate approved promotion against staging evidence
        env:
          RELEASE_APPROVED_BY: ${{ needs.approve-production.outputs.approved_by }}
          RELEASE_BACKUP_ID: ${{ needs.approve-production.outputs.backup_id }}
          RELEASE_STRICT_ENVIRONMENT: "true"
          RELEASE_TARGET: production
          STAGING_RELEASE_REPORT: artifacts/releases/${{ inputs.release_id }}.json
        run: bun run release:validate -- --promotion --release-id "${RELEASE_ID}-production"
      - name: Apply production D1 migrations after approved backup
        working-directory: apps/api
        run: bunx wrangler d1 migrations apply DB --env production --remote
      - name: Upload production-bound saved versions
        run: |
          (cd apps/api && bunx wrangler versions upload dist/index.js --env production --no-bundle --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
          (cd apps/admin && bunx wrangler versions upload worker-dist/index.js --env production --no-bundle --assets dist --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
          (cd apps/storefront && bunx wrangler versions upload worker-dist/index.js --env production --no-bundle --assets .output/public --tag "$RELEASE_TAG" --message "$RELEASE_ID" --strict)
      - name: Deploy production versions after environment approval
        env:
          APPROVED_BY: ${{ needs.approve-production.outputs.approved_by }}
          PRODUCTION_BACKUP_ID: ${{ needs.approve-production.outputs.backup_id }}
        run: |
          (cd apps/api && bunx wrangler versions deploy --env production --version-tag "$RELEASE_TAG" --message "$RELEASE_ID approved by $APPROVED_BY after backup $PRODUCTION_BACKUP_ID" --yes)
          (cd apps/admin && bunx wrangler versions deploy --env production --version-tag "$RELEASE_TAG" --message "$RELEASE_ID approved by $APPROVED_BY after backup $PRODUCTION_BACKUP_ID" --yes)
          (cd apps/storefront && bunx wrangler versions deploy --env production --version-tag "$RELEASE_TAG" --message "$RELEASE_ID approved by $APPROVED_BY after backup $PRODUCTION_BACKUP_ID" --yes)
