name: Hosted full validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_EQUIVALENCE_MAX_BROWSER_WORKERS: "2"
    steps:
      - name: Check out the immutable validation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.5
      - name: Install browser runtime
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99shoppp-ci-network >/dev/null
          for attempt in 1 2; do
            if timeout --kill-after=30s 12m bunx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Install font inspection runtime
        run: sudo apt-get install --yes woff2
      - name: Validate release candidate
        run: bun run release:validate -- --release-id "ci-${GITHUB_SHA}"
      - name: Preserve the exact release report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-report-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/releases/ci-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 14
