name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_EQUIVALENCE_MAX_BROWSER_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install browser runtime
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99shoppp-ci-network >/dev/null
          for attempt in 1 2; do
            if timeout --kill-after=30s 12m bunx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Install font inspection runtime
        run: sudo apt-get install --yes woff2
      - name: Validate release candidate
        run: bun run release:validate -- --release-id "ci-${GITHUB_SHA}"
      - name: Preserve release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ github.sha }}
          path: artifacts/releases/
          if-no-files-found: error
