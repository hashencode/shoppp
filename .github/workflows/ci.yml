name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_EQUIVALENCE_MAX_BROWSER_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install browser runtime
        run: bunx playwright install --with-deps chromium
      - name: Install font inspection runtime
        run: sudo apt-get install --yes woff2
      - name: Validate release candidate
        run: bun run release:validate -- --release-id "ci-${GITHUB_SHA}"
      - name: Preserve release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ github.sha }}
          path: artifacts/releases/
          if-no-files-found: error
