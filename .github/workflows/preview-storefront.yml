name: Build private storefront preview

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact preview build attempt ID
        required: true
        type: string
      snapshot_id:
        description: Approved immutable experience snapshot ID
        required: true
        type: string

concurrency:
  group: fashion-staging-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: fashion-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_API_TOKEN: ${{ secrets.PREVIEW_BUILD_TOKEN }}
      PREVIEW_API_URL: ${{ vars.PREVIEW_API_URL }}
      PREVIEW_HANDOFF_ORIGIN: ${{ vars.PREVIEW_HANDOFF_ORIGIN }}
      PREVIEW_ORIGIN: ${{ vars.PREVIEW_ORIGIN }}
      FASHION_U13_AUTHORITY_ORIGIN: ${{ vars.PREVIEW_API_URL }}
      FASHION_U13_BUILD_ID: ${{ inputs.build_id }}
      FASHION_U13_CURRENCY: ${{ vars.FASHION_U13_CURRENCY }}
      FASHION_U13_HANDOFF_ORIGIN: ${{ vars.PREVIEW_HANDOFF_ORIGIN }}
      FASHION_U13_PREVIEW_ORIGIN: ${{ vars.PREVIEW_ORIGIN }}
      FASHION_U13_PRODUCT_ID: ${{ vars.FASHION_U13_PRODUCT_ID }}
      FASHION_U13_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FASHION_U13_VARIANT_ID: ${{ vars.FASHION_U13_VARIANT_ID }}
      BUILD_ID: ${{ inputs.build_id }}
      SNAPSHOT_ID: ${{ inputs.snapshot_id }}
      STOREFRONT_BUILD_MODE: preview
      STOREFRONT_EXPERIENCE_FILE: ${{ github.workspace }}/artifacts/preview/build-input.json
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Validate fixed build inputs
        id: validate
        run: |
          if [[ ! "$SNAPSHOT_ID" =~ ^[a-z][a-z0-9-]{2,99}$ ]]; then
            echo "Invalid immutable snapshot identifier." >&2
            exit 1
          fi
          if [[ ! "$BUILD_ID" =~ ^preview-build-[a-z0-9-]{3,100}-[1-9][0-9]*$ ]]; then
            echo "Invalid preview build identifier." >&2
            exit 1
          fi
          node - <<'NODE'
          for (const name of ["PREVIEW_API_URL", "PREVIEW_HANDOFF_ORIGIN", "PREVIEW_ORIGIN"]) {
            const value = process.env[name] ?? "";
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value) {
              throw new Error(`${name} must be one exact credential-free HTTPS origin`);
            }
          }
          NODE
      - name: Fetch fixed build input from the preview authority
        id: build-input
        run: |
          mkdir -p artifacts/preview
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $PREVIEW_API_TOKEN" \
            "$PREVIEW_API_URL/build/storefront-experiences/builds/$BUILD_ID" \
            --output "$STOREFRONT_EXPERIENCE_FILE"
          jq -e \
            --arg origin "$PREVIEW_ORIGIN" \
            --arg snapshot "$SNAPSHOT_ID" \
            '.environment == "preview" and .expectedOrigin == $origin and .snapshot.id == $snapshot and (.inputIdentity | type == "object") and .catalogRelease.releaseId == .inputIdentity.catalogReleaseId' \
            "$STOREFRONT_EXPERIENCE_FILE" >/dev/null
          CATALOG_RELEASE_ID="$(jq -er '.catalogRelease.releaseId' "$STOREFRONT_EXPERIENCE_FILE")"
          printf 'catalog_release_id=%s\n' "$CATALOG_RELEASE_ID" >> "$GITHUB_OUTPUT"
          printf 'experience_version=%s\n' "$(jq -er '.inputIdentity.experienceVersion' "$STOREFRONT_EXPERIENCE_FILE")" >> "$GITHUB_OUTPUT"
          printf 'platform_contract_version=%s\n' "$(jq -er '.inputIdentity.platformContractVersion' "$STOREFRONT_EXPERIENCE_FILE")" >> "$GITHUB_OUTPUT"
          printf 'theme_id=%s\n' "$(jq -er '.inputIdentity.themeId' "$STOREFRONT_EXPERIENCE_FILE")" >> "$GITHUB_OUTPUT"
          printf 'theme_version=%s\n' "$(jq -er '.inputIdentity.themeVersion' "$STOREFRONT_EXPERIENCE_FILE")" >> "$GITHUB_OUTPUT"
      - name: Build and verify isolated static preview
        run: |
          bun run --cwd apps/storefront build
          bun run --cwd apps/storefront verify:static
      - name: Describe content-addressed preview artifact
        id: artifact
        env:
          CATALOG_RELEASE_ID: ${{ steps.build-input.outputs.catalog_release_id }}
        run: |
          PACKAGE_ARGS=(
            "--snapshot-id=$SNAPSHOT_ID"
            "--catalog-release-id=$CATALOG_RELEASE_ID"
            "--output=apps/storefront/.output/public"
            "--manifest=artifacts/preview/artifact-manifest.json"
          )
          ARTIFACT_JSON="$(bun apps/storefront/scripts/package-preview-artifact.ts "${PACKAGE_ARGS[@]}")"
          printf '%s\n' "$ARTIFACT_JSON" > artifacts/preview/deployment.json
          printf 'prefix=%s\n' "$(jq -r '.prefix' <<<"$ARTIFACT_JSON")" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$(jq -r '.digest' <<<"$ARTIFACT_JSON")" >> "$GITHUB_OUTPUT"
      - name: Upload immutable files to the private preview bucket
        run: |
          while IFS= read -r ITEM; do
            PATH_VALUE="$(jq -r '.path' <<<"$ITEM")"
            SOURCE_VALUE="$(jq -r '.sourcePath' <<<"$ITEM")"
            CONTENT_TYPE="$(jq -r '.contentType' <<<"$ITEM")"
            bunx wrangler r2 object put \
              "shoppp-storefront-preview-artifacts/${{ steps.artifact.outputs.prefix }}/$PATH_VALUE" \
              --file "$SOURCE_VALUE" \
              --content-type "$CONTENT_TYPE" \
              --remote
          done < <(jq -c '.files[]' artifacts/preview/deployment.json)
          bunx wrangler r2 object put \
            "shoppp-storefront-preview-artifacts/${{ steps.artifact.outputs.prefix }}/_preview-manifest.json" \
            --file artifacts/preview/artifact-manifest.json \
            --content-type "application/json; charset=utf-8" \
            --remote
      - name: Deploy the isolated preview access Worker
        working-directory: apps/storefront
        run: |
          bunx wrangler deploy \
            --config wrangler.preview.jsonc \
            --var "PREVIEW_HANDOFF_ORIGIN:$PREVIEW_HANDOFF_ORIGIN" \
            --var "PREVIEW_ORIGIN:$PREVIEW_ORIGIN"
      - name: Report the exact preview artifact to the authority
        id: report
        run: |
          EXPIRES_AT="$(date -u -d '+24 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $PREVIEW_API_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: preview-build-result-$BUILD_ID" \
            --data '{"artifactDigest":"${{ steps.artifact.outputs.digest }}","artifactPrefix":"${{ steps.artifact.outputs.prefix }}","expiresAt":"'"$EXPIRES_AT"'","status":"deployed"}' \
            "$PREVIEW_API_URL/build/storefront-experiences/builds/$BUILD_ID/status"
      - name: Run deployed Fashion U13 acceptance
        env:
          FASHION_U13_CATALOG_RELEASE_ID: ${{ steps.build-input.outputs.catalog_release_id }}
          FASHION_U13_EXPERIENCE_VERSION: ${{ steps.build-input.outputs.experience_version }}
          FASHION_U13_PLATFORM_CONTRACT_VERSION: ${{ steps.build-input.outputs.platform_contract_version }}
          FASHION_U13_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          FASHION_U13_SERVICE_TOKEN: ${{ secrets.FASHION_U13_SERVICE_TOKEN }}
          FASHION_U13_THEME_ID: ${{ steps.build-input.outputs.theme_id }}
          FASHION_U13_THEME_VERSION: ${{ steps.build-input.outputs.theme_version }}
        run: bun tools/run-fashion-staging-u13.ts > artifacts/preview/u13-report.json
      - name: Report Fashion preview accepted
        run: |
          jq -e '.passed == true and .runId == "${{ github.run_id }}-${{ github.run_attempt }}"' \
            artifacts/preview/u13-report.json >/dev/null
          printf 'Fashion preview accepted by deployed U13.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Report a failed preview build
        if: failure() && steps.validate.outcome == 'success' && steps.report.outcome != 'success'
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $PREVIEW_API_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: preview-build-failure-$BUILD_ID" \
            --data '{"failureCode":"preview.build-failed","status":"failed"}' \
            "$PREVIEW_API_URL/build/storefront-experiences/builds/$BUILD_ID/status"
      - name: Preserve private build metadata
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-${{ inputs.snapshot_id }}
          path: artifacts/preview/
          if-no-files-found: error
          retention-days: 7
